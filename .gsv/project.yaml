schema: gsv.project/v1
id: kilo-archi
name: KILO_ARCHi
repo: GSV-Sublime-Optimization/KILO_ARCHi
domain: application
maturity: active-source-candidate
build_profile: hybrid
os: [macos]
privacy: public
agent_policy: supervised
release: manual
authority: native ARCHi companion state and assistance boundaries; Unity companion/practice presentation; local creator marketplace source candidate
notes: >
  Preserve ARCHi's existing ownership split. Native Swift owns assistance, permissions,
  shared working-copy state, kept lessons and saved companion development. Unity is a
  disconnected presentation/practice surface and must not become a second save or
  memory authority. The retained TypeScript Journey/battle engine keeps its existing
  ownership. Qwen/Codex are bounded inference lanes, not identity or memory owners.
  This repository is a source candidate, not a Beta declaration or notarized release.
upstream:
  - {name: local-qwen, via: desktop native runtime manager, required: false, note: "Managed local Ollama/Qwen lane; model/runtime installation remains external"}
  - {name: codex-account-integration, via: bounded fallback/compare lane, required: false, note: "External lane only after explicit admission; no silent fallback loop"}
downstream:
  - {name: native-app, surface: desktop/, consumers: [macos-user]}
  - {name: unity-companion, surface: unity/ARCHi/, consumers: [native-handoff, local-practice]}
  - {name: creator-marketplace, surface: marketplace/, consumers: [native-app]}
